<style>
        /* Ambient Background Effect */
        .ambient-bg {
            position: absolute;
            inset: 0;
            overflow: hidden;
            z-index: 0;
            pointer-events: none;
        }
        .ambient-bg::before,
        .ambient-bg::after {
            content: '';
            position: absolute;
            width: 800px;
            height: 800px;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.15;
        }
        .ambient-bg::before {
            top: -200px;
            left: -200px;
            background: #005696; /* university-blue */
            animation: float 20s ease-in-out infinite alternate;
        }
        .ambient-bg::after {
            bottom: -200px;
            right: -200px;
            background: #1a56db; /* primary-container */
            animation: float 25s ease-in-out infinite alternate-reverse;
        }

        @keyframes float {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }

        /* Input specific reset to override forms plugin defaults slightly for our design system */
        input[type="email"]:focus {
            box-shadow: 0 0 0 3px rgba(0, 63, 177, 0.2); /* primary color focus ring */
        }
    </style>

<body class="bg-background min-h-screen flex items-center justify-center relative font-sans text-on-surface antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- Decorative Background -->
<div class="ambient-bg"></div>
<!-- Main Content Container -->
<main class="relative z-10 w-full max-w-[440px] px-margin-mobile md:px-0 flex flex-col items-center">
<!-- Brand Header (Outside Card for hierarchy) -->
<div class="flex items-center gap-stack-sm mb-stack-lg">
<div class="w-10 h-10 rounded-lg bg-university-blue flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-on-primary" data-weight="fill" style="font-variation-settings: 'FILL' 1;">local_activity</span>
</div>
<span class="font-display text-headline-md text-university-blue tracking-tight">Gatherum</span>
</div>
<!-- Login Card -->
<div class="w-full bg-surface-container-lowest rounded-xl shadow-[0px_10px_30px_rgba(0,0,0,0.08)] border border-outline-variant/30 overflow-hidden">
<div class="p-stack-lg flex flex-col gap-stack-lg">
<!-- Typography Header -->
<div class="text-center flex flex-col gap-stack-sm">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-surface">Welcome to Gatherum</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Sign in or create an account to manage your university events.</p>
</div>
<!-- Auth Form -->
<form class="flex flex-col gap-stack-md" onsubmit="event.preventDefault();">
<!-- Email Input Group -->
<div class="flex flex-col gap-base">
<label class="font-label-bold text-label-bold text-on-surface" for="email">Email address</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">mail</span>
</div>
<input class="h-[56px] w-full pl-12 pr-4 rounded-lg bg-surface border border-outline-variant text-body-md font-body-md text-on-surface placeholder:text-outline focus:border-primary transition-colors" id="email" name="email" placeholder="name@poornima.edu.in" required="" type="email"/>
</div>
</div>
<!-- Primary Action -->
<button class="h-[56px] w-full flex items-center justify-center gap-2 rounded-lg bg-primary text-on-primary font-label-bold text-label-bold hover:bg-surface-tint hover:shadow-[0px_4px_12px_rgba(0,63,177,0.2)] transition-all active:scale-[0.98]" type="submit">
<span class="material-symbols-outlined text-[20px]">magic_button</span>
                        Send Magic Link
                    </button>
<p class="text-center font-body-sm text-body-sm text-on-surface-variant mt-[-8px]">
                        No password required. We'll email you a secure link.
                    </p>
</form>
<!-- Divider -->
<div class="flex items-center gap-4 py-2">
<div class="flex-1 h-px bg-outline-variant/50"></div>
<span class="font-label-caps text-label-caps text-outline uppercase tracking-wider">Or</span>
<div class="flex-1 h-px bg-outline-variant/50"></div>
</div>
<!-- Secondary Auth -->
<button class="h-[56px] w-full flex items-center justify-center gap-3 rounded-lg bg-surface-container-lowest border border-outline-variant text-on-surface font-label-bold text-label-bold hover:bg-surface-container-low transition-colors shadow-sm active:scale-[0.98]" type="button">
