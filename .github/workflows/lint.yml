name: Automated Bug Finder (Linting & Type Checking)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  find_bugs:
    name: Find Bugs & Errors
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Type Checker
        run: npm run lint

      - name: Run ESLint
        run: npx eslint .
